<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Tengu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #2b2140; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; image-rendering: pixelated; outline: none; cursor: default; }
    /* On a phone held upright, a note to turn it sideways. */
    #turn { display: none; position: fixed; inset: 0; background: #2b2140; color: #fff6fb; font: 800 18px Nunito, sans-serif; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 14px; z-index: 2; }
    #turn .phone { width: 34px; height: 58px; border: 4px solid #ff8fc1; border-radius: 9px; animation: turn 2.2s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="turn"><div class="phone"></div>Turn your phone sideways to play</div>
  <script type="module">
    // On the web, a service worker (sw.js) checks every file with the server on each load, so an
    // update never leaves a browser with a mix of old and new modules. If the game still fails to
    // start (a browser from before the worker, holding old files), it reloads once through the
    // worker; a second failure says so instead of leaving a blank screen.
    const web = location.protocol.startsWith('http') && 'serviceWorker' in navigator;
    if (web) navigator.serviceWorker.register('sw.js').catch(() => {});
    import('./src/main.js').then(() => sessionStorage.removeItem('tengu-retried')).catch(async (err) => {
      console.error(err);
      if (web && !sessionStorage.getItem('tengu-retried')) {
        sessionStorage.setItem('tengu-retried', '1');
        await Promise.race([navigator.serviceWorker.ready, new Promise((r) => setTimeout(r, 3000))]).catch(() => {});
        location.reload();
        return;
      }
      const note = document.getElementById('turn');
      note.textContent = 'Tengu could not start. Please reload the page.';
      note.style.display = 'flex';
    });
  </script>
</body>
</html>
