<!doctype html>
<html><body style="margin:0;background:#f6f0ff">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: look samples for the Cleric of light (docs/design/mage-line.md): the mage robes as
// vestments in a few colour schemes (the robe colour, with gold trim), at a few set levels, holding
// her sun scepter. ?time=0.4 freezes.
import { drawHero } from '../src/render/hero.js';
import { setHd } from '../src/render/pixel.js';
import { ITEMS } from '../src/data/items.js';

const q = new URLSearchParams(location.search);
const SCHEMES = (q.get('schemes') ?? 'Cleric:#fbf4e4').split(',').map((s) => s.split(':'));
const LEVELS = (q.get('levels') ?? '10,30,50').split(',').map(Number);
for (const [, color] of SCHEMES) for (const lv of LEVELS) for (const slot of ['hat', 'top', 'bottom', 'shoes', 'gloves', 'cape']) {
  const src = ITEMS[`mage_${slot}_${lv}`];
  ITEMS[`cl_${slot}_${lv}_${color}`] = { ...src, id: `cl_${slot}_${lv}_${color}`, color, accent: '#8fd8ff' };
}
const S = Number(q.get('scale') ?? 2.6);
const CW = 70, CH = 92, LEFT = 110;
const canvas = document.getElementById('c');
canvas.width = (LEFT + LEVELS.length * CW + 10) * S;
canvas.height = (SCHEMES.length * CH + 30) * S;
const ctx = canvas.getContext('2d');
setHd?.(true, S);
const look = { hairStyle: q.get('hair') ?? 'wavylong', hairColor: '#3a2a4a', skinTone: '#fbe2cf', eyeColor: '#b8324a', eyeStyle: 'jewel', face: 'smile' };
function frame(now) {
  const time = q.get('time') ? Number(q.get('time')) : now / 1000;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.fillStyle = '#f6f0ff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#3a2d4f';
  ctx.font = 'bold 8px sans-serif';
  LEVELS.forEach((lv, i) => ctx.fillText(`Lv ${lv}`, LEFT + i * CW + 26, 16));
  SCHEMES.forEach(([name, color], r) => {
    ctx.fillStyle = r % 2 ? '#efe6fb' : '#fbf7ff';
    ctx.fillRect(0, 24 + r * CH, canvas.width, CH);
    ctx.fillStyle = '#3a2d4f';
    ctx.font = 'bold 9px sans-serif';
    ctx.fillText(name, 8, 24 + r * CH + 50);
    LEVELS.forEach((lv, i) => {
      const gear = { weapon: { id: `wand_${lv}` } };
      for (const slot of ['hat', 'top', 'bottom', 'shoes', 'gloves', 'cape']) gear[slot] = { id: q.get('raw') ? `cl_${slot}_${lv}_${color}` : `mage_${slot}_${lv}` };
      const x = LEFT + i * CW + CW / 2;
      const y = 24 + r * CH + CH - 10;
      ctx.fillStyle = 'rgba(120,90,160,0.14)';
      ctx.beginPath(); ctx.ellipse(x, y, 15, 3, 0, 0, Math.PI * 2); ctx.fill();
      drawHero(ctx, look, gear, x, y, { pose: 'idle', ready: true, time: time + 0.2, scale: 1.35, facing: 1, job: 'shrinemaiden', seed: 1 });
    });
  });
  if (!q.get('time')) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.ready = true;
</script>
</body></html>
