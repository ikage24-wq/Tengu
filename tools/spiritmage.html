<!doctype html>
<html><body style="margin:0;background:#222">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: a real game world (the same code the game runs) with a level 30 Spirit Mage and a row
// of training dummies, holding attack (her shrine dance), drawn with the game's own scene renderer.
// Open /tools/spiritmage.html (served with the game). ?slow=1.6 plays every dance figure that many
// times longer (to try dance speeds); ?style=grounded|float|ribbon tries a dance style; ?full keeps Kami's Favour on; ?manual steps frames from
// outside (window.step) for recording; ?skill=spiritwave (any of hers) casts it every ?every=2.2 s;
// ?behind puts a dummy behind her too; ?job=shrinemaiden (or onmyoji) makes her one of her paths.
import { createWorld, updateWorld, loadMap } from '../src/world/world.js';
import { createCharacter, gainExp, advanceJob } from '../src/core/character.js';
import { makeEquip } from '../src/core/items.js';
import { spawnMob } from '../src/world/mobs.js';
import { cast } from '../src/world/combat.js';
import { createCamera, updateCamera, drawWorld } from '../src/render/scene.js';
import { setHd, nextFrame } from '../src/render/pixel.js';
import { preloadFxSprites } from '../src/render/fx-sprites.js';
import { VW, VH } from '../src/input.js';
import { PATH_COMBOS, PATH_VARIANTS } from '../src/world/melee.js';
import { setDanceStyle } from '../src/render/moves.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const SCALE = 2;
canvas.width = VW * SCALE;
canvas.height = VH * SCALE;
preloadFxSprites();

const slow = Number(q.get('slow') ?? 1);
const figures = new Set([...PATH_COMBOS.spiritmage, ...PATH_VARIANTS.spiritmage.flat()]);
for (const f of figures) f.dur *= slow;
if (q.has('style')) setDanceStyle(q.get('style'));

const c = createCharacter('Tester', {});
gainExp(c, 1e6);
advanceJob(c, 'spiritmage');
// ?job=shrinemaiden (or onmyoji): one of her level 30 paths, past Elowen's trial.
if (q.get('job')) {
  c.quests.spiritmage_trial = { state: 'done', kills: {} };
  advanceJob(c, q.get('job'));
}
c.equipment.weapon = makeEquip('wand_20', {});
Object.assign(c.skills, { spiritbolt: 20, spiritstep: 10, spiritwave: 20, blessing: 20, spiritward: 15, manamastery: 20, heavenslantern: 10 });
c.mp = 9999;
c.baseMp = 99999;
const w = createWorld(c);
loadMap(w, 'woods', 'west');
w.god = true;
w.spawner.slots = [];
w.mobs = [];
const x0 = 360;
Object.assign(w.body, { x: x0, y: w.map.groundY, facing: 1, onGround: true });
for (const dx of [...(q.has('behind') ? [-110] : []), 110, 170, 230, 300, 360]) {
  const m = spawnMob(w.map, { mob: 'boarlet', x: x0 + dx, y: w.map.groundY });
  m.def = { ...m.def, hp: 1e9, eva: 0, aggro: false, speed: 0 };
  m.hp = 1e9;
  w.mobs.push(m);
}
const idle = { held: new Set(), pressed: new Set(), locked: false };
const hold = { held: new Set(['KeyZ']), pressed: new Set(), locked: false };
const cam = createCamera();
let t = 0;
for (let i = 0; i < 30; i++) updateWorld(w, 1 / 60, idle);
function step(dt) {
  t += dt;
  if (q.has('full')) {
    w.spirit = 100;
    w.spiritAt = w.now;
  }
  // ?skill=id casts that skill now and again (Heaven's Lantern on a full gauge); otherwise she
  // holds attack.
  const skill = q.get('skill');
  if (skill && t > 0.5 && !w.pose && !w.lantern && t >= (window.nextCast ?? 0)) {
    if (skill === 'heavenslantern') [w.spirit, w.spiritAt] = [100, w.now];
    if (skill === 'blessing') c.hp = Math.round(c.hp * 0.4);
    console.log('cast', skill, JSON.stringify(cast(w, skill)));
    window.nextCast = t + Number(q.get('every') ?? 2.2);
  }
  const fighting = t > 0.5 && !skill;
  // (A recording can steer her: window.input, a held-keys input, overrides all of this.)
  for (let k = 0; k < Math.round(dt * 60); k++) updateWorld(w, 1 / 60, window.input ?? (fighting ? hold : idle));
  nextFrame();
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;
  setHd(true, SCALE);
  updateCamera(cam, w, dt);
  drawWorld(ctx, w, cam, t);
}
window.step = step;
// (The page's clock, the one the renderer's idle acting runs on.)
Object.defineProperty(window, 'pageTime', { get: () => t });
window.world = w;
window.cam = cam;
if (!q.has('manual')) {
  let last = performance.now();
  const loop = (now) => { step(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script></body></html>
