<!doctype html>
<html><body style="margin:0;background:#2a2440">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: samples of the Onmyoji's yuki-onna (on the player character, her own new parts:
// jobgear/troupe.js yuki*, hair.js yuki*, hero.js's yuki eyes, lips and marks), each a different
// take on her, full body beside the Onmyoji for size, and close up. To pick from.
import { drawPosed } from '../src/render/hero.js';
import { setHd, nextFrame } from '../src/render/pixel.js';

const SCALE = 1.7;
const PALE = '#f4f6ff';
const SAMPLES = [
  ['1. Classic snow woman', { hairStyle: 'yukistraight', hairColor: '#1e1a2a', skinTone: PALE, eyeColor: '#7ab8f0', eyeStyle: 'yukicalm', outfit: 'yukiclassic', mouth: 'yukilips', marks: [], lid: 0.3 }],
  ['2. Frost princess', { hairStyle: 'yukiwave', hairColor: '#dce8f8', skinTone: PALE, eyeColor: '#5a9ae8', eyeStyle: 'yukicalm', outfit: 'yukiprincess', mouth: 'yukilips', marks: ['frostmark'], lid: 0.2 }],
  ['3. Blizzard ghost', { hairStyle: 'yukistorm', hairColor: '#f2f6ff', skinTone: PALE, eyeColor: '#a8d8ff', eyeStyle: 'yukistare', outfit: 'yukighost', mouth: 'yukibreath', marks: ['icetear'] }],
  ['4. Classic, cold stare', { hairStyle: 'yukistraight', hairColor: '#1e1a2a', skinTone: PALE, eyeColor: '#a8d8ff', eyeStyle: 'yukistare', outfit: 'yukiclassic', mouth: 'yukilips', marks: ['icetear'] }],
  ['5. Silver, sorrowful', { hairStyle: 'yukistraight', hairColor: '#dce8f8', skinTone: PALE, eyeColor: '#7ab8f0', eyeStyle: 'yukicalm', outfit: 'yukighost', mouth: 'yukilips', marks: ['icetear', 'frostmark'], lid: 0.35 }],
  ['6. Black-haired princess', { hairStyle: 'yukiwave', hairColor: '#1e1a2a', skinTone: PALE, eyeColor: '#5a9ae8', eyeStyle: 'yukicalm', outfit: 'yukiprincess', mouth: 'yukibreath', marks: ['frostmark'], lid: 0.2 }],
];
const BROWS = { brows: [[0.15, -0.1], [0.15, -0.1]] };
const S = 2.6;
const CW = 300;
const CH = 470;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = CW * SAMPLES.length;
canvas.height = CH + 300;
nextFrame();
ctx.fillStyle = '#c8e0ec';
ctx.fillRect(0, 0, canvas.width, canvas.height);
const MAIDEN = { hairStyle: 'hime', hairColor: '#2a2440', skinTone: '#fff0e6', eyeColor: '#8a6ad8', outfit: 'miko', outfitColor: '#ffffff' };
const rig = { frontArm: [0.4, -2], backArm: [0.6, -2.6], frontLeg: [1.4, 0, 2], backLeg: [-1.4, 0, -2], hx: -0.2, hy: 0.2, tilt: -2, face: BROWS };
SAMPLES.forEach(([name, look], i) => {
  const cx = i * CW + CW / 2 + 20;
  const gy = CH - 40;
  ctx.fillStyle = '#9ec0d0';
  ctx.fillRect(i * CW, gy, CW, 3);
  setHd(true, S * SCALE);
  drawPosed(ctx, { outfitColor: '#ffffff', browStyle: 'thin', earStyle: 'round', ...look }, cx, gy, rig, { scale: S * SCALE, facing: 1 });
  setHd(true, S);
  drawPosed(ctx, MAIDEN, cx - 110, gy, {}, { scale: S, facing: 1 });
  // Close up.
  ctx.save();
  ctx.beginPath();
  ctx.rect(i * CW, CH, CW, 300);
  ctx.clip();
  setHd(true, S * 3.2);
  drawPosed(ctx, { outfitColor: '#ffffff', browStyle: 'thin', earStyle: 'round', ...look }, i * CW + CW / 2 + 6, CH + 400, rig, { scale: S * 3.2, facing: 1 });
  ctx.restore();
  ctx.fillStyle = '#1e2a40';
  ctx.font = 'bold 16px Segoe UI, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(name, i * CW + 10, 24);
});
window.done = true;
</script></body></html>
