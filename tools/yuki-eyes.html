<!doctype html>
<html><body style="margin:0;background:#2a2440">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: the yuki-onna's eyes to pick from (hero.js yuki* eye styles, all her own), each on her
// face with her blunt bangs (hair.js yukihime), close up.
import { drawPosed } from '../src/render/hero.js';
import { setHd, nextFrame } from '../src/render/pixel.js';

const EYES = [
  ['A. Snowflake pupils', 'yukiflake', '#6ab0f0'],
  ['B. Snowflake, veiled', 'yukiflakeveil', '#6ab0f0'],
  ['C. Sleepy veil', 'yukiveil', '#7ab8f0'],
  ['D. Cold bar pupils', 'yukibar', '#9ad0ff'],
  ['E. Diamond pupils', 'yukidiamond', '#5a9ae8'],
  ['F. Glass doll', 'yukiglass', '#a8d8ff'],
  ['G. Narrow glance', 'yukislit', '#7ab8f0'],
  ['H. Calm (before)', 'yukicalm', '#7ab8f0'],
];
const LOOK = { hairStyle: 'yukihime', hairColor: '#1e1a2a', skinTone: '#f4f6ff', browStyle: 'none', earStyle: 'round', outfit: 'yukiclassic', outfitColor: '#ffffff', mouth: 'yukilips', marks: [] };
const rig = { frontArm: [0.4, -2], backArm: [0.6, -2.6], hx: -0.2, hy: 0.2, tilt: -2, face: { brows: [[0.15, -0.1], [0.15, -0.1]] } };
const S = 7.2;
const CW = 300;
const CH = 300;
const COLS = 4;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = CW * COLS;
canvas.height = CH * 2;
nextFrame();
ctx.fillStyle = '#c8e0ec';
ctx.fillRect(0, 0, canvas.width, canvas.height);
EYES.forEach(([name, eyeStyle, eyeColor], i) => {
  const col = i % COLS;
  const row = Math.floor(i / COLS);
  ctx.save();
  ctx.beginPath();
  ctx.rect(col * CW, row * CH, CW, CH);
  ctx.clip();
  setHd(true, S);
  drawPosed(ctx, { ...LOOK, eyeStyle, eyeColor }, col * CW + CW / 2 + 6, row * CH + 360, rig, { scale: S, facing: 1 });
  ctx.restore();
  ctx.fillStyle = '#1e2a40';
  ctx.font = 'bold 16px Segoe UI, sans-serif';
  ctx.fillText(name, col * CW + 10, row * CH + 22);
});
window.done = true;
</script></body></html>
