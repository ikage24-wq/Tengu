<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;background:#222">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: a Mochi race course as the race camera sees it, for before/after pictures of course art.
//   ?course=sprint            which stage (world/stadium.js)
//   &xs=300,900,1500,2100     where the camera looks (world x), one frame each, laid out in a sheet
//   &zoom=1.65                how close (the race's follow shot is about 1.7; 1 = the whole width)
//   &cols=2                   frames across the sheet
//   &pano=1                   instead: the whole course at zoom 1, end to end, scaled down (&ps=0.5)
//   &t=3                      seconds of clock before the picture (for things that move)
//   &racers=1                 the six racers stood in a bunch where each frame looks (0: none)
// When it's done the title says "ready", and window.SHOT holds the picture as a PNG data URL.
import { createCharacter } from '../src/core/character.js';
import { createWorld, updateWorld, loadMap } from '../src/world/world.js';
import { createCamera, updateCamera, drawWorld } from '../src/render/scene.js';
import { setHd, nextFrame } from '../src/render/pixel.js';
import { preloadFxSprites } from '../src/render/fx-sprites.js';
import { rollMochi, STATS } from '../src/data/mochi-genes.js';
import { newRecord } from '../src/data/mochi-raise.js';
import { startRace } from '../src/world/mochi-race.js';
import { groundAt } from '../src/world/physics.js';
import { VW, VH } from '../src/input.js';

const q = new URLSearchParams(location.search);
const SCALE = Number(q.get('s') ?? 2);
preloadFxSprites();
const rec = newRecord(rollMochi(Number(q.get('seed') ?? 7)));
for (const st of STATS) Object.assign(rec.stats[st], { points: 900, level: 56 });
rec.stage = 'karamochi';
const char = createCharacter('Mina', { hairStyle: 'bob' });
char.garden = { back: null, mochi: [rec], eggs: [], unlocked: {} };
char.raceWins = Object.fromEntries(['sprint', 'swim', 'climb', 'glide', 'hills', 'grand', 'tour'].flatMap((s) => ['hatchling', 'beginner', 'challenge'].map((r) => [`${s}|${r}`, true])));
const w = createWorld(char);
w.log = () => {};
window.W = w;
loadMap(w, 'mochi_stadium', 'board');
startRace(w, rec, q.get('course') ?? 'sprint', 'beginner');
const idle = { held: new Set(), pressed: new Set(), locked: false };
// (Long enough for the map's arrival fade to play out.)
for (let k = 0; k < 240; k++) updateWorld(w, 1 / 60, idle);
const R = w.race;
const map = w.map;
// (Held at the line: nobody runs off; the camera is ours.)
R.phase = 'run';
R.clock = 30;
R.t = 30;
await new Promise((res) => setTimeout(res, 2500));

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const view = document.createElement('canvas');
view.width = VW * SCALE;
view.height = VH * SCALE;
const vctx = view.getContext('2d');
const cam = createCamera();
let cut = 0;
// (One clock across every frame: the scene's arrival fade runs from the first one drawn.)
let now = 100;
function frame(x, zoom, secs, racers) {
  cut += 1;
  // (Over water the race camera follows the swimmers at its surface.)
  const lake = (map.water ?? []).find((w) => x > w.x1 && x < w.x2);
  const y = lake ? lake.y : groundAt(map, x);
  // (The racers in a little bunch where it looks, running in place.)
  R.racers.forEach((r, i) => {
    r.x = racers ? x - 40 + i * 16 : -9999;
    // (Over water, swimming at its surface.)
    const wet = (map.water ?? []).find((w) => r.x > w.x1 && r.x < w.x2);
    r.y = wet ? wet.y : groundAt(map, r.x);
    r.leg = wet ? 1 : 0;
    Object.assign(r.m, { mode: wet ? 'swim' : 'run', inWater: Boolean(wet), speed: racers ? 70 : 0, tired: 0 });
  });
  for (let k = 0; k < Math.max(1, Math.round(secs * 60)); k++) {
    now += 1 / 60;
    for (const r of R.racers) r.m.dist += (r.m.speed ?? 0) / 60;
    R.cam = { x, y, cut, zoom };
    updateCamera(cam, w, 1 / 60);
    // (Drawn every few steps, as the game would, so whatever eases along with the frames has.)
    if (k % 6 === 0) draw();
  }
  draw();
  return view;
}

function draw() {
  nextFrame();
  vctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  vctx.imageSmoothingEnabled = false;
  setHd(true, SCALE);
  drawWorld(vctx, w, cam, now);
}
// (First, a few seconds drawn for the arrival fade.)
frame(VW, 1, 3, false);
const secs = Number(q.get('t') ?? 3);
const racers = q.get('racers') !== '0';
if (q.get('pano')) {
  // The whole course end to end at zoom 1, one screen at a time, scaled down.
  const ps = Number(q.get('ps') ?? 0.5);
  // (Each screen's left edge, a screen apart; the race camera puts what it looks at 0.4 across.)
  const lefts = [];
  for (let l = 0; l < map.width - VW; l += VW) lefts.push(l);
  lefts.push(map.width - VW);
  canvas.width = Math.round(map.width * SCALE * ps);
  canvas.height = Math.round(VH * SCALE * ps);
  ctx.imageSmoothingEnabled = true;
  lefts.forEach((l, i) => {
    const f = frame(l + VW * 0.4, 1, i === 0 ? secs : 0.05, false);
    ctx.drawImage(f, Math.round(l * SCALE * ps), 0, Math.round(VW * SCALE * ps), Math.round(VH * SCALE * ps));
  });
} else {
  const xs = (q.get('xs') ?? '400,1000,1600,2200').split(',').map(Number);
  const cols = Number(q.get('cols') ?? 2);
  const zoom = Number(q.get('zoom') ?? 1.65);
  const fw = VW * SCALE;
  const fh = VH * SCALE;
  canvas.width = cols * fw + (cols - 1) * 8;
  canvas.height = Math.ceil(xs.length / cols) * (fh + 8) - 8;
  xs.forEach((x, i) => {
    const f = frame(x, zoom, secs, racers);
    ctx.drawImage(f, (i % cols) * (fw + 8), Math.floor(i / cols) * (fh + 8));
  });
}
window.SHOT = canvas.toDataURL('image/png');
document.title = 'ready';
</script>
</body></html>
