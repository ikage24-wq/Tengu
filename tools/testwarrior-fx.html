<!doctype html>
<meta charset="utf-8">
<title>Test warrior effects</title>
<style>body { margin: 0; background: #2b2340; } canvas { display: block; } iframe { position: absolute; left: -9999px; width: 1280px; height: 720px; }</style>
<canvas id="c"></canvas>
<script src="/tools/fx-art.js"></script>
<script type="module">
// Dev tool: the test warrior's skill effects (tools/fx-art.js, the `tw*` ones), every drawing in
// order, then each played over the warrior and a row of training dummies on the move stage at its
// key drawing, so they can be judged at game size.
const FX = [['twsweep', 'Crescent Sweep'], ['twhit', 'Hit mark (on each monster)'], ['twcrash', 'Iron Crash'], ['twrush', 'Iron Rush'], ['twfury', 'War Spirit (buff)']];
const D = 2;
const c = document.getElementById('c');
const W = 1900;
c.width = W;
c.height = 2100;
const ctx = c.getContext('2d');
ctx.fillStyle = '#2b2340';
ctx.fillRect(0, 0, W, c.height);
let y = 10;
for (const [name, label] of FX) {
  const e = window.FXART[name];
  ctx.fillStyle = '#f6f0ff';
  ctx.font = 'bold 18px Segoe UI, sans-serif';
  ctx.fillText(label, 10, y + 20);
  y += 30;
  let x = 10;
  let rowH = 0;
  for (let i = 0; i < e.n; i++) {
    const r = window.FXHD.render(e, i, D);
    const k = Math.min(1, 180 / r.canvas.width);
    const w = r.canvas.width * k;
    const h = r.canvas.height * k;
    if (x + w > W - 10) {
      x = 10;
      y += rowH + 8;
      rowH = 0;
    }
    ctx.drawImage(r.canvas, x, y, w, h);
    x += w + 8;
    rowH = Math.max(rowH, h);
  }
  y += rowH + 24;
}
// The mock: the stage with the warrior and three dummies, effects laid over at game size.
const f = document.createElement('iframe');
f.src = '/tools/moves-stage.html?job=warrior&level=50&weapon=sword_30';
document.body.appendChild(f);
await new Promise((res) => { const w = () => (f.contentWindow?.ready ? res() : setTimeout(w, 50)); w(); });
const win = f.contentWindow;
for (let i = 0; i < 45; i++) win.step(1 / 30);
win.place(380);
win.caption('');
win.step(1 / 30);
const img = new Image();
img.src = win.frame();
await img.decode();
ctx.fillStyle = '#f6f0ff';
ctx.font = 'bold 18px Segoe UI, sans-serif';
ctx.fillText('At game size (2x): Crescent Sweep over the row with a hit mark on each; Iron Crash; War Spirit', 10, y + 20);
y += 30;
// Stage canvas: 2 screen px per game px. Hero feet near (690, 668); dummies at about 860, 940, 1020.
const S = 2;
const place = (name, i, gx, gy) => {
  const e = window.FXART[name];
  const r = window.FXHD.render(e, i, D * S / 2);
  // The strip is drawn at D strip px per game px: game size = canvas / D, then stage = * S.
  const k = S / D;
  return (ox, oy) => ctx.drawImage(r.canvas, ox + gx - r.px * k, oy + gy - r.py * k, r.canvas.width * k, r.canvas.height * k);
};
const shots = [
  [['twsweep', 2, 720, 612], ['twhit', 2, 860, 585], ['twhit', 1, 940, 585], ['twhit', 3, 1020, 585]],
  [['twcrash', 4, 900, 668], ['twhit', 2, 900, 585]],
  [['twfury', 4, 690, 668]],
];
shots.forEach((list, s) => {
  const ox = 10 + s * 630 - 440;
  ctx.save();
  ctx.beginPath();
  ctx.rect(10 + s * 630, y, 620, 400);
  ctx.clip();
  ctx.drawImage(img, ox, y - 380);
  for (const [n, i, gx, gy] of list) place(n, i, gx, gy)(ox, y - 380);
  ctx.restore();
});
document.title = 'ready';
</script>
