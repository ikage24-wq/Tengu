<!doctype html>
<html><body style="margin:0;background:#2a2440">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: the tengu's faces to pick from (render/tengu.js TENGU_LOOK, on the player character):
// his hair styles, his eye shapes (each with a smirk of his), and eye colours, close up.
import { drawPosed } from '../src/render/hero.js';
import { setHd, nextFrame } from '../src/render/pixel.js';
import { TENGU_LOOK } from '../src/render/tengu.js';

const ROWS = [
  ['Hair', [
    ['1. Center part (now)', { hairStyle: 'tengupart' }],
    ['2. Side swept', { hairStyle: 'tengusweep' }],
    ['3. Long, tied low', { hairStyle: 'tengulong' }],
    ['4. Wolf cut', { hairStyle: 'tenguwolf' }],
    ['5. Half up', { hairStyle: 'tenguhalf' }],
    ['6. Slicked back', { hairStyle: 'tenguslick' }],
  ]],
  ['Faces', [
    ['A. Smug (now)', { eyeStyle: 'tengusmug', mouth: 'tengusmirk' }],
    ['B. Fox', { eyeStyle: 'tengufox', mouth: 'tengusly' }],
    ['C. Heavy-lidded', { eyeStyle: 'tenguheavy', mouth: 'tengucool', lid: 0.35 }],
    ['D. Keen', { eyeStyle: 'tengukeen', mouth: 'tengugrin' }],
    ['E. Calm', { eyeStyle: 'tengucalm', mouth: 'tengusmirk' }],
    ['F. Hawk', { eyeStyle: 'tenguhawk', mouth: 'tengusly' }],
  ]],
  ['Eye colours', [
    ['Gold (now)', { eyeColor: '#e8a83a' }],
    ['Crimson', { eyeColor: '#d8343a' }],
    ['Violet', { eyeColor: '#9a6ae8' }],
    ['Ice blue', { eyeColor: '#6ab8f0' }],
    ['Jade', { eyeColor: '#3ab88a' }],
    ['Silver', { eyeColor: '#b8bccc' }],
  ]],
];
const CW = 250;
const CH = 300;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = CW * 6;
canvas.height = ROWS.length * (CH + 30);
nextFrame();
ctx.fillStyle = '#c8e0ec';
ctx.fillRect(0, 0, canvas.width, canvas.height);
const rig = { frontArm: [-3, 4], backArm: [3, 4], frontLeg: [1.4, 0, 2], backLeg: [-1.4, 0, -2], hx: 0.2, hy: 0, tilt: 4, face: { brows: [[0.1, -0.1], [0.5, -0.45]], glance: 0 } };
const S = 6.2;
ROWS.forEach(([title, cells], r) => {
  const y0 = r * (CH + 30);
  ctx.fillStyle = '#1e2a40';
  ctx.font = 'bold 18px Segoe UI, sans-serif';
  ctx.fillText(title, 10, y0 + 22);
  cells.forEach(([name, o], i) => {
    const x0 = i * CW;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0 + 4, y0 + 30, CW - 8, CH - 36);
    ctx.fillStyle = i % 2 ? '#d4e8f0' : '#c2dce8';
    ctx.fill();
    ctx.clip();
    setHd(true, S);
    drawPosed(ctx, { ...TENGU_LOOK, ...o }, x0 + CW / 2 + 6, y0 + 30 + 330, rig, { scale: S, facing: 1 });
    ctx.restore();
    ctx.fillStyle = '#1e2a40';
    ctx.font = 'bold 14px Segoe UI, sans-serif';
    ctx.fillText(name, x0 + 12, y0 + 30 + CH - 14);
  });
});
window.done = true;
</script></body></html>
