<!doctype html>
<html><body style="margin:0;background:#fff6ec">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: the Kitchen Witch's moves played on her in the witch-toque and apron dress (the mage line
// rework; docs/design/kitchen-witch.md), for recording: window.draw(kind, progress, dur, weapon,
// caption) draws one frame. Used by a Playwright recorder to make GIFs.
import { drawHero } from '../src/render/hero.js';
import { setHd } from '../src/render/pixel.js';
import { ITEMS } from '../src/data/items.js';
import { JOB_GEAR } from '../src/render/jobgear/index.js';
import kitchen from '../src/render/jobgear/kitchen.js';

JOB_GEAR.kitchen = kitchen;
for (const slot of ['hat', 'top', 'bottom', 'shoes', 'gloves']) ITEMS[`kw_${slot}`] = { id: `kw_${slot}`, name: slot, type: 'equip', slot, design: 'job', family: 'kitchen', tier: 0, color: '#e8544a' };
const S = 3;
const W = 220, H = 150;
const canvas = document.getElementById('c');
canvas.width = W * S;
canvas.height = H * S;
const ctx = canvas.getContext('2d');
setHd?.(true, S);
const look = { hairStyle: 'fluffybob', hairColor: '#7a4a32', skinTone: '#fbe2cf', eyeColor: '#4a8a5a', eyeStyle: 'jewel', face: 'smile' };
window.draw = (kind, progress, dur, weapon, caption, time) => {
  const gear = { weapon: { id: weapon ?? window.WPN } };
  for (const slot of ['hat', 'top', 'bottom', 'shoes', 'gloves']) gear[slot] = { id: `kw_${slot}` };
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.fillStyle = '#fff6ec';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f3e2cc';
  ctx.fillRect(0, 124, W, H - 124);
  ctx.fillStyle = 'rgba(160,100,80,0.16)';
  ctx.beginPath(); ctx.ellipse(80, 124, 16, 3, 0, 0, Math.PI * 2); ctx.fill();
  const state = kind ? { pose: kind, progress, dur, time, facing: 1, job: 'spiritmage', seed: 1, ready: true } : { pose: 'idle', ready: true, time, facing: 1, job: 'spiritmage', seed: 1 };
  drawHero(ctx, look, gear, 80, 124, { ...state, scale: 1.6 });
  ctx.fillStyle = '#5a3f3a';
  ctx.font = 'bold 9px sans-serif';
  ctx.fillText(caption ?? '', 8, 14);
};
window.ready = true;
</script>
</body></html>
