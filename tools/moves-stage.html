<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;background:#222">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: a job among a line of training dummies, driven key by key from outside, drawn with the
// game's own renderer, with a caption. For demo videos (tools/record-moves.cjs):
// ?job=shinobi&level=45&learn=inkdance&weapon=dagger_45, then window.step(dt, held, pressed) and window.caption(text).
import { balanceChar } from './balance.mjs';
import { createWorld, updateWorld, loadMap } from '../src/world/world.js';
import { spawnMob } from '../src/world/mobs.js';
import { MOBS } from '../src/data/mobs.js';
import { createCamera, updateCamera, drawWorld } from '../src/render/scene.js';
import { setHd, nextFrame } from '../src/render/pixel.js';
import { preloadFxSprites } from '../src/render/fx-sprites.js';
import { VW, VH } from '../src/input.js';
import { JOBS } from '../src/data/jobs.js';
import { text, box } from '../src/ui/kit.js';
import { makeEquip } from '../src/core/items.js';
import { bindFreeHotkey } from '../src/core/character.js';
import { SKILLS } from '../src/data/skills.js';
import { gaugeOf } from '../src/world/melee.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const SCALE = 2;
canvas.width = VW * SCALE;
canvas.height = VH * SCALE;
preloadFxSprites();

const job = q.get('job') ?? 'thief';
const level = Number(q.get('level') ?? (JOBS[job].tier === 1 ? 25 : 45));
const c = balanceChar(job, level);
c.mp = c.baseMp = 99999;
// ?learn=inkdance: a passive to try (at its top level).
for (const id of (q.get('learn') ?? '').split(',').filter(Boolean)) c.skills[id] = 10;
// ?weapon=sword_45: hold a given weapon.
if (q.get('weapon')) c.equipment.weapon = makeEquip(q.get('weapon'));
// ?hair=wavylong&hairColor=%23ffb38a: wear a given hairstyle (to judge hair motion).
if (q.get('hair')) c.appearance = { ...c.appearance, hairStyle: q.get('hair'), hairColor: q.get('hairColor') ?? '#ffb38a', eyeStyle: 'jewel' };
// Every skill it has goes on a hotkey, in order (Q, W, E, R, A, S...), to press from outside.
for (const id of Object.keys(c.skills)) if (SKILLS[id] && SKILLS[id].type !== 'passive') bindFreeHotkey(c, { skill: id });
const w = createWorld(c);
w.log = () => {};
loadMap(w, 'woods', 'west');
w.spawner.slots = [];
w.mobs = [];
w.god = true;
Object.assign(w.body, { x: 300, y: w.map.groundY, facing: 1 });
const base = Object.values(MOBS).filter((m) => !m.boss && m.level <= level - 8).sort((a, b) => b.level - a.level)[0];
// ?spread=90: the dummies further apart (rings bouncing between them read better).
const gap = Number(q.get('spread') ?? 40);
const homes = [430, 430 + gap, 430 + gap * 2];
for (const x of homes) {
  const m = spawnMob(w.map, { mob: base.id, x, y: w.map.groundY });
  m.def = { ...m.def, hp: 1e9, aggro: false, speed: 0, atk: 0 };
  m.hp = 1e9;
  w.mobs.push(m);
}
const cam = createCamera();
// Settle in first (a level-up glow and the map's arrival fade play out off camera).
for (let k = 0; k < 240; k++) updateWorld(w, 1 / 60, { held: new Set(), pressed: new Set(), locked: false });
let t = 0;
let words = '';

function step(dt, held = [], pressed = []) {
  const n = Math.round(dt * 60);
  for (let k = 0; k < n; k++) {
    // (Training dummies: they stay put however hard they're hit.)
    w.mobs.forEach((m, i) => Object.assign(m, { hp: 1e9, x: homes[i], knockVx: 0 }));
    updateWorld(w, 1 / 60, { held: new Set(held), pressed: new Set(k === 0 ? pressed : []), locked: false });
  }
  t += dt;
  nextFrame();
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;
  setHd(true, SCALE);
  updateCamera(cam, w, dt);
  drawWorld(ctx, w, cam, t);
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  box(ctx, 10, 10, 200, 30, { fill: 'rgba(255,250,248,0.94)', edge: '#f4bcd8', r: 10, width: 2 });
  text(ctx, JOBS[job].name, 22, 30, { size: 13, bold: true, color: '#4a3560' });
  if (words) {
    ctx.font = 'bold 11px sans-serif';
    const ww = ctx.measureText(words).width + 30;
    box(ctx, VW / 2 - ww / 2, VH - 44, ww, 26, { fill: 'rgba(40,30,58,0.86)', edge: '#ffd66b', r: 12, width: 2 });
    text(ctx, words, VW / 2, VH - 27, { size: 11, bold: true, align: 'center', color: '#ffffff' });
  }
}

window.step = step;
window.caption = (s) => (words = s);
window.place = (x) => Object.assign(w.body, { x, y: w.map.groundY, vx: 0, vy: 0, onGround: true, rope: null, facing: 1 });
window.frame = () => canvas.toDataURL('image/jpeg', 0.92);
// (For recorders: fill the job's gauge, see which key holds which skill.)
window.world = w;
window.fill = () => { const g = gaugeOf(w.char); if (g) { w[g] = 100; w[`${g}At`] = w.now; } };
window.keys = () => Object.fromEntries(Object.entries(c.hotkeys).map(([k, b]) => [k, b?.skill ?? b?.item ?? null]));
window.ready = true;

// ?record=PLAN: plays a plan and prints the frames (cropped round the hero, as data URLs, JSON)
// into <pre id="out"> for a headless browser's --dump-dom (tools/make-gif.py). The plan is steps
// split by ';': KEY:secs records while holding a key (_ for none, a press on its first frame),
// !KEY:secs plays without recording, place:x moves the hero, cap:text sets the caption, gauge:n
// fills the job's gauge.
if (q.get('record')) {
  const keep = setInterval(() => {}, 10);
  // (The effect strips load first, so nothing pops in blank.)
  await new Promise((res) => setTimeout(res, 2500));
  const FPS = 20;
  const crop = document.createElement('canvas');
  crop.width = 520;
  crop.height = 300;
  const cx = crop.getContext('2d');
  const frames = [];
  for (let i = 0; i < 45; i++) step(1 / 30);
  for (const part of q.get('record').split(';')) {
    const [head, arg] = [part.slice(0, part.indexOf(':')), part.slice(part.indexOf(':') + 1)];
    if (head === 'place') { window.place(Number(arg)); continue; }
    if (head === 'cap') { words = arg; continue; }
    // gauge:100 fills the job's gauge (for a finisher).
    if (head === 'gauge') { const g = gaugeOf(w.char); w[g] = Number(arg); w[`${g}At`] = w.now; continue; }
    const quiet = head.startsWith('!');
    const key = head.replace('!', '');
    // (Keys joined by + are held together: ArrowUp+KeyZ.)
    const held = key === '_' ? [] : key.split('+');
    const n = Math.round(Number(arg) * FPS);
    for (let i = 0; i < n; i++) {
      step(1 / FPS, held, i === 0 ? held : []);
      if (quiet) continue;
      // (?cropy=300 raises the window, for a hero dancing up in the air.)
      cx.drawImage(canvas, 430, Number(q.get('cropy') ?? 380), 624, 360, 0, 0, 520, 300);
      frames.push(crop.toDataURL('image/jpeg', 0.88));
    }
  }
  const out = document.createElement('pre');
  out.id = 'out';
  out.textContent = JSON.stringify(frames);
  document.body.appendChild(out);
  clearInterval(keep);
  document.title = 'done';
}
</script></body></html>
