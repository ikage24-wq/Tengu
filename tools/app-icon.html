<!doctype html>
<html><body style="margin:0;background:transparent">
<canvas id="c" width="256" height="256"></canvas>
<script type="module">
// Dev tool: the desktop app's icon (electron/icon.png, made by `npm run icon`): Hayate close up,
// the sleepy wind princess (render/hayate.js) wide awake and excited for once, her cloud of white
// hair, crystal crown and princess gown, on a pink rounded square with sparkles.
import { drawHero } from '../src/render/hero.js';
import { setHd, nextFrame } from '../src/render/pixel.js';
import { HAYATE_LOOK, hayateGear } from '../src/render/hayate.js';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// A rounded square with a soft top-to-bottom gradient and a light rim.
const r = 52;
const box = () => {
  ctx.beginPath();
  ctx.moveTo(12 + r, 12);
  ctx.arcTo(244, 12, 244, 244, r);
  ctx.arcTo(244, 244, 12, 244, r);
  ctx.arcTo(12, 244, 12, 12, r);
  ctx.arcTo(12, 12, 244, 12, r);
  ctx.closePath();
};
const g = ctx.createLinearGradient(0, 12, 0, 244);
g.addColorStop(0, '#ffe0ec');
g.addColorStop(1, '#ffa8c8');
box();
ctx.fillStyle = g;
ctx.fill();
ctx.lineWidth = 6;
ctx.strokeStyle = '#ffffff';
ctx.stroke();
ctx.save();
box();
ctx.clip();
// Sparkles round her.
ctx.fillStyle = '#ffffff';
for (const [sx, sy, sr] of [[46, 52, 8], [212, 60, 6], [206, 206, 7], [44, 200, 5]]) {
  ctx.beginPath();
  for (let k = 0; k < 8; k++) {
    const a = (k * Math.PI) / 4;
    const rr = k % 2 ? sr * 0.35 : sr;
    ctx.lineTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr);
  }
  ctx.fill();
}
// (The sprites load a moment after the page.)
await new Promise((res) => setTimeout(res, 800));
nextFrame();
const S = 6.6;
setHd(true, S);
ctx.translate(128, 300);
ctx.scale(S, S);
drawHero(ctx, { ...HAYATE_LOOK, eyeStyle: 'sparkle', face: 'excited' }, hayateGear(), 0, 0, { pose: 'idle', time: 0.6, seed: 7, facing: 1 });
ctx.restore();
window.done = true;
</script></body></html>
