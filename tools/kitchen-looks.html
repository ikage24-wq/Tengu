<!doctype html>
<html><body style="margin:0;background:#fff6ec">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: concept looks for the Kitchen Witch (the mage line rework; docs/design/kitchen-witch.md),
// drawn with the game's own hero renderer. Each row is one hat look on the apron dress, holding the
// ladle (quick) and the frying pan (heavy), in a few dress colours. ?scale=3 zooms, ?time=0.4 freezes.
import { drawHero } from '../src/render/hero.js';
import { setHd } from '../src/render/pixel.js';
import { ITEMS } from '../src/data/items.js';
import { JOB_GEAR } from '../src/render/jobgear/index.js';
import kitchen from '../src/render/jobgear/kitchen.js';

JOB_GEAR.kitchen = kitchen;
const q = new URLSearchParams(location.search);
const LOOKS = [['Witch-toque', 0], ['Witch hat', 1], ['Kerchief', 2]];
const COLORS = (q.get('colors') ?? '#e8544a,#f08a3c,#5a8ad8').split(',');
for (const [, t] of LOOKS) for (const [ci, color] of COLORS.entries()) for (const slot of ['hat', 'top', 'bottom', 'shoes', 'gloves']) {
  const id = `kitchen_${slot}_${t}_${ci}`;
  ITEMS[id] = { id, name: id, type: 'equip', slot, design: 'job', family: 'kitchen', tier: t, color };
}
const WEAPONS = [['wand', 'wand_10'], ['staff', 'staff_10']];
const S = Number(q.get('scale') ?? 3);
const CW = 58, CH = 88, LEFT = 86;
const cols = COLORS.length * WEAPONS.length;
const canvas = document.getElementById('c');
canvas.width = (LEFT + cols * CW + 10) * S;
canvas.height = (LOOKS.length * CH + 30) * S;
const ctx = canvas.getContext('2d');
setHd?.(true, S);
const look = { hairStyle: q.get('hair') ?? 'fluffybob', hairColor: '#7a4a32', skinTone: '#fbe2cf', eyeColor: '#4a8a5a', eyeStyle: 'jewel', face: 'smile' };
function frame(now) {
  const time = q.get('time') ? Number(q.get('time')) : now / 1000;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.fillStyle = '#fff6ec';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#5a3f3a';
  ctx.font = 'bold 8px sans-serif';
  COLORS.forEach((c, ci) => WEAPONS.forEach(([w], wi) => ctx.fillText(w === 'wand' ? 'ladle' : 'pan', LEFT + (ci * 2 + wi) * CW + 18, 16)));
  LOOKS.forEach(([name, t], r) => {
    ctx.fillStyle = r % 2 ? '#fbeedd' : '#fff9f1';
    ctx.fillRect(0, 24 + r * CH, canvas.width, CH);
    ctx.fillStyle = '#5a3f3a';
    ctx.font = 'bold 9px sans-serif';
    ctx.fillText(name, 8, 24 + r * CH + 48);
    COLORS.forEach((color, ci) => WEAPONS.forEach(([type, wid], wi) => {
      const gear = { weapon: { id: wid, variant: 'chef' } };
      for (const slot of ['hat', 'top', 'bottom', 'shoes', 'gloves']) gear[slot] = { id: `kitchen_${slot}_${t}_${ci}` };
      const x = LEFT + (ci * 2 + wi) * CW + CW / 2;
      const y = 24 + r * CH + CH - 10;
      ctx.fillStyle = 'rgba(160,100,80,0.14)';
      ctx.beginPath(); ctx.ellipse(x, y, 15, 3, 0, 0, Math.PI * 2); ctx.fill();
      drawHero(ctx, look, gear, x, y, { pose: 'idle', ready: q.get('ready') !== '0', time: time + 0.2, scale: 1.4, facing: 1, job: 'spiritmage', seed: 1 });
    }));
  });
  if (!q.get('time')) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.ready = true;
</script>
</body></html>
