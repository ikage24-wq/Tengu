<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;background:#eef5e6">
<canvas id="c" width="800" height="620" style="width:100%;max-width:800px;image-rendering:pixelated"></canvas>
<script type="module">
// Dev tool: the Mochi's animations (render/mochi-anim.js). Top: the four running gaits on
// treadmills (Run talent E, C, A, S); below: four Mochi standing about in their personalities.
// ?manual steps only through window.step(dt) (for recording); window.frame() gives the canvas.
import { rollMochi } from '../src/data/mochi-genes.js';
import { drawMochiAnim, GAITS, RUN_STYLES, SWIMS, FLIES, CLIMBS, STAMINAS, SIGNATURE } from '../src/render/mochi-anim.js';
import { PERSONALITIES } from '../src/data/mochi-genes.js';
import { ACTIONS } from '../src/render/mochi-anim.js';
import { drawHatch, drawEvolve } from '../src/render/mochi-life.js';
import { drawSweet, drawBall, SWEET_KINDS } from '../src/render/mochi-sweets.js';

const c = document.getElementById('c');
const ctx = c.getContext('2d');
const q = new URLSearchParams(location.search);
const Z = 4;
// One runner per running style, its Run points just past each threshold.
const points = RUN_STYLES.map((p, i) => p + [150, 100, 100, 100, 100, 200][i]);
const runners = points.map((runPoints, i) => ({ genes: rollMochi(60 + i, { coat: null }), dir: 1, speed: GAITS[i].speed, dist: 0, runPoints }));
const idlers = ['playful', 'shy', 'proud', 'sleepy'].map((personality, i) => ({ genes: rollMochi(70 + i, { coat: null, personality }), dir: 1, speed: 0, dist: 0 }));
let t = 0;
function label(text, x, y) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#4a3a4f';
  ctx.fillText(text, x, y);
}
// ?acts: one runner per tier, big, the act it's playing named under it (personalities chosen to
// show their favourite acts).
const actors = ['timid', 'bubbly', 'playful', 'cheeky', 'hyper', 'sassy'].map((personality, i) => ({ genes: rollMochi(80 + i, { coat: null, personality }), dir: 1, speed: GAITS[i].speed, dist: 0, runPoints: RUN_STYLES[i] + 100 }));
function stepActs(dt) {
  t += dt;
  const ZB = 5;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#eef5e6';
  ctx.fillRect(0, 0, c.width, c.height);
  actors.forEach((m, i) => {
    m.dist += m.speed * dt;
    const x = 133 + (i % 3) * 267;
    const y = 230 + Math.floor(i / 3) * 290;
    ctx.setTransform(ZB, 0, 0, ZB, 0, 0);
    ctx.fillStyle = '#bfe3a8';
    ctx.fillRect((x - 125) / ZB, y / ZB, 250 / ZB, 4);
    ctx.fillStyle = '#9fd08a';
    for (let k = -2; k < 6; k++) ctx.fillRect((x - 170) / ZB + ((((-m.dist) % 12) + 12) % 12) + k * 12, y / ZB, 2, 4);
    drawMochiAnim(ctx, m, x / ZB, y / ZB, t);
    label(`${GAITS[i].name} · ${m.genes.personality}`, x, y + 44);
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#9a4ad0';
    ctx.fillText(m.acting ? `~ ${m.acting} ~` : '', x, y + 62);
  });
}
// ?swim / ?fly: one Mochi per style, its points just past each threshold, in a pool or the air.
const kind = q.has('swim') ? 'swim' : q.has('fly') ? 'fly' : null;
const TABLE = kind === 'swim' ? SWIMS : FLIES;
const movers = RUN_STYLES.map((need, i) => ({ genes: rollMochi(90 + i, { coat: null }), dir: 1, speed: TABLE[i].speed, dist: 0, mode: kind, [`${kind}Points`]: need + 120 }));
function stepKind(dt) {
  t += dt;
  const ZB = 5;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = kind === 'swim' ? '#eef5e6' : '#dff0fb';
  ctx.fillRect(0, 0, c.width, c.height);
  movers.forEach((m, i) => {
    m.dist += m.speed * dt;
    const x = 133 + (i % 3) * 267;
    const y = (kind === 'swim' ? 200 : 260) + Math.floor(i / 3) * 290;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (kind === 'swim') {
      // The pool: a tiled wall behind, deeper water below the surface, ripples sliding past.
      ctx.fillStyle = '#b9d7e6';
      ctx.fillRect(x - 125, y - 150, 250, 150);
      ctx.fillStyle = '#a9cbdc';
      for (let k = 0; k < 6; k++) ctx.fillRect(x - 125, y - 150 + k * 25, 250, 2);
      ctx.fillStyle = '#9ed2f2';
      ctx.fillRect(x - 125, y, 250, 70);
      ctx.fillStyle = '#c4e6f8';
      for (let k = -1; k < 6; k++) ctx.fillRect(x - 125 + ((((-m.dist * ZB) % 60) + 60) % 60) + k * 60, y + 30, 26, 3);
    } else {
      ctx.fillStyle = '#bfe3a8';
      ctx.fillRect(x - 125, y, 250, 16);
      ctx.fillStyle = '#9fd08a';
      for (let k = -1; k < 6; k++) ctx.fillRect(x - 125 + ((((-m.dist * ZB) % 60) + 60) % 60) + k * 60, y, 10, 16);
    }
    ctx.setTransform(ZB, 0, 0, ZB, 0, 0);
    drawMochiAnim(ctx, m, x / ZB, y / ZB, t);
    label(`${TABLE[i].name} · ${kind === 'swim' ? 'Swim' : 'Fly'} ${m[`${kind}Points`]}`, x, y + (kind === 'swim' ? 90 : 36));
  });
}
// ?climb: one Mochi per climbing style (Power points) on a brick wall sliding down past it.
const climbers = RUN_STYLES.map((need, i) => ({ genes: rollMochi(100 + i, { coat: null }), dir: 1, speed: CLIMBS[i].speed, dist: 0, mode: 'climb', powerPoints: need + 120 }));
function stepClimb(dt) {
  t += dt;
  const ZB = 5;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#eef5e6';
  ctx.fillRect(0, 0, c.width, c.height);
  climbers.forEach((m, i) => {
    m.dist += m.speed * dt;
    const x = 133 + (i % 3) * 267;
    const y = 230 + Math.floor(i / 3) * 290;
    ctx.fillStyle = '#c9b49a';
    ctx.fillRect(x - 70, y - 210, 140, 240);
    ctx.fillStyle = '#b39c80';
    const off = ((m.dist * ZB) % 40 + 40) % 40;
    for (let r = -1; r < 7; r++) {
      const ry = y - 210 + r * 40 + off;
      ctx.fillRect(x - 70, ry, 140, 3);
      for (let k = 0; k < 3; k++) ctx.fillRect(x - 70 + k * 56 + (r % 2 ? 28 : 0), ry, 3, 40);
    }
    ctx.setTransform(ZB, 0, 0, ZB, 0, 0);
    drawMochiAnim(ctx, m, x / ZB, y / ZB, t);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#eef5e6';
    ctx.fillRect(x - 120, y + 32, 240, 30);
    label(`${CLIMBS[i].name} · Power ${m.powerPoints}`, x, y + 50);
  });
}
// ?stamina: six sprinters with more and more Stamina, running on: watch who tires.
const stamRunners = RUN_STYLES.map((need, i) => ({ genes: rollMochi(110 + i, { coat: null }), dir: 1, speed: GAITS[3].speed, dist: 0, runPoints: 1250, staminaPoints: need + 120 }));
function stepStamina(dt) {
  t += dt;
  const ZB = 5;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#eef5e6';
  ctx.fillRect(0, 0, c.width, c.height);
  stamRunners.forEach((m, i) => {
    m.speed = m.resting ? 0 : GAITS[3].speed * (1 - 0.45 * (m.fatigue ?? 0));
    m.dist += m.speed * dt;
    const x = 133 + (i % 3) * 267;
    const y = 230 + Math.floor(i / 3) * 290;
    ctx.setTransform(ZB, 0, 0, ZB, 0, 0);
    ctx.fillStyle = '#bfe3a8';
    ctx.fillRect((x - 125) / ZB, y / ZB, 250 / ZB, 4);
    ctx.fillStyle = '#9fd08a';
    for (let k = -2; k < 6; k++) ctx.fillRect((x - 125) / ZB + ((((-m.dist) % 12) + 12) % 12) + k * 12, y / ZB, 2, 4);
    drawMochiAnim(ctx, m, x / ZB, y / ZB, t);
    label(`${STAMINAS[i].name} · Stamina ${m.staminaPoints}`, x, y + 44);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#9a4ad0';
    ctx.fillText(m.resting ? 'catching its breath' : `tired ${Math.round((m.fatigue ?? 0) * 100)}%`, x, y + 62);
  });
}
// ?idle=N: eight personalities standing about (page N of 4), the idle moment each is in named under
// it; add &sig to see only their signatures.
const page = Number(q.get('idle')) || 0;
const loafers = PERSONALITIES.slice(page * 8, page * 8 + 8).map((personality, i) => ({ genes: rollMochi(120 + page * 8 + i, { coat: null, personality }), dir: i % 2 ? -1 : 1, speed: 0, dist: 0, idleBits: q.has('sig') ? [SIGNATURE[personality]] : undefined }));
function stepIdle(dt) {
  t += dt;
  const ZB = 5;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#eef5e6';
  ctx.fillRect(0, 0, c.width, c.height);
  loafers.forEach((m, i) => {
    const x = 100 + (i % 4) * 200;
    const y = 250 + Math.floor(i / 4) * 290;
    ctx.setTransform(ZB, 0, 0, ZB, 0, 0);
    ctx.fillStyle = '#bfe3a8';
    ctx.fillRect((x - 90) / ZB, y / ZB, 180 / ZB, 4);
    drawMochiAnim(ctx, m, x / ZB, y / ZB, t);
    label(m.genes.personality, x, y + 40);
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#9a4ad0';
    ctx.fillText(m.idling ? `~ ${m.idling.replace('sig_', '')} ~` : '', x, y + 58);
  });
}
// ?act: one Mochi per action, doing it again and again (the looping ones kept at it a while); ?sweets:
// the sixteen sweets, whole and bitten, and the ball.
const doers = Object.keys(ACTIONS).map((name, i) => ({ genes: rollMochi(200 + i, { coat: null }), dir: i % 2 ? -1 : 1, speed: 0, dist: 0, noIdle: true, todo: name }));
function stepAct(dt) {
  t += dt;
  const ZB = 5;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#eef5e6';
  ctx.fillRect(0, 0, c.width, c.height);
  doers.forEach((m, i) => {
    if (!m.action && t >= (m.again ?? 0.3)) m.action = { name: m.todo, t0: t, hold: 4 };
    const x = 100 + (i % 4) * 200;
    const y = 250 + Math.floor(i / 4) * 290;
    ctx.setTransform(ZB, 0, 0, ZB, 0, 0);
    ctx.fillStyle = '#bfe3a8';
    ctx.fillRect((x - 90) / ZB, y / ZB, 180 / ZB, 4);
    drawMochiAnim(ctx, m, x / ZB, y / ZB, t);
    if (!m.action && !m.again) m.again = t + 1;
    if (m.action) m.again = null;
    label(m.todo, x, y + 40);
  });
}
function stepSweets(dt) {
  t += dt;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#eef5e6';
  ctx.fillRect(0, 0, c.width, c.height);
  const Zs = 8;
  ctx.setTransform(Zs, 0, 0, Zs, 0, 0);
  SWEET_KINDS.forEach((kind, i) => {
    const x = 6 + (i % 8) * 12.5;
    const y = 14 + Math.floor(i / 8) * 34;
    drawSweet(ctx, kind, x, y, 0.75, 0);
    drawSweet(ctx, kind, x, y + 14, 0.75, 1 + (i % 3));
  });
  drawBall(ctx, 50, 74, 0.6, t * 4);
}
// ?life: three eggs hatching (common, legendary, a mutation), and two Mochiko evolving (the angel
// path, the demon path), over and over.
const LIFE = [
  { kind: 'hatch', coat: null, seed: 301 }, { kind: 'hatch', coat: 'moonlit', seed: 302 }, { kind: 'hatch', coat: 'beniume', seed: 303 },
  { kind: 'evolve', path: 'angel', seed: 304 }, { kind: 'evolve', path: 'demon', seed: 305 },
];
let lives = [];
let lifeAt = -99;
function stepLife(dt) {
  t += dt;
  if (t - lifeAt > 9.5) {
    lifeAt = t;
    lives = LIFE.map((L, i) => ({ genes: rollMochi(L.seed, { coat: L.coat }), dir: i % 2 ? -1 : 1, speed: 0, dist: 0, size: 'baby', noIdle: true, ...(L.kind === 'hatch' ? { hatch: { t0: t + 0.3 } } : { evolve: { t0: t + 0.5, path: L.path } }) }));
  }
  const ZB = 5;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#eef5e6';
  ctx.fillRect(0, 0, c.width, c.height);
  lives.forEach((m, i) => {
    const top = i < 3;
    const x = top ? 133 + i * 267 : 200 + (i - 3) * 400;
    const y = top ? 250 : 540;
    ctx.setTransform(ZB, 0, 0, ZB, 0, 0);
    ctx.fillStyle = '#bfe3a8';
    ctx.fillRect((x - 120) / ZB, y / ZB, 240 / ZB, 4);
    if (m.hatch) drawHatch(ctx, m, x / ZB, y / ZB, t);
    else drawEvolve(ctx, m, x / ZB, y / ZB, t);
    label(m.hatch ? `hatching · ${m.genes.rarity}` : `evolving · ${m.evolve.path}`, x, y + 40);
  });
}
// ?feat: the ten grown features, one Mochi each, standing about (?feat=run, fly or swim: moving).
const FEATS = ['featherwings', 'batwings', 'anklewings', 'swepthorns', 'veilfins', 'fintail', 'halo', 'curlhorns', 'cloudtail', 'deviltail'];
const featMode = q.get('feat') || 'stand';
const grown = FEATS.map((feature, i) => ({ genes: { ...rollMochi(400 + i, { coat: null }), feature, path: i % 2 ? 'demon' : 'angel', stage: i % 2 ? 'karamochi' : 'amamochi' }, dir: 1, speed: featMode === 'run' ? 40 : 0, dist: 0, mode: featMode === 'stand' ? 'run' : featMode, runPoints: 800, flyPoints: 800, swimPoints: 800 }));
function stepFeat(dt) {
  t += dt;
  const ZB = 4;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#eef5e6';
  ctx.fillRect(0, 0, c.width, c.height);
  grown.forEach((m, i) => {
    m.dist += m.speed * dt;
    const x = 80 + (i % 5) * 160;
    const y = (featMode === 'fly' ? 210 : 250) + Math.floor(i / 5) * 290;
    ctx.setTransform(ZB, 0, 0, ZB, 0, 0);
    if (featMode !== 'fly') {
      ctx.fillStyle = '#bfe3a8';
      ctx.fillRect((x - 75) / ZB, y / ZB, 150 / ZB, 4);
    }
    drawMochiAnim(ctx, m, x / ZB, y / ZB, t);
    label(m.genes.feature, x, y + 36);
  });
}
function step(dt) {
  if (q.has('feat')) return stepFeat(dt);
  if (q.has('life')) return stepLife(dt);
  if (q.has('act')) return stepAct(dt);
  if (q.has('sweets')) return stepSweets(dt);
  if (q.has('idle')) return stepIdle(dt);
  if (q.has('climb')) return stepClimb(dt);
  if (q.has('stamina')) return stepStamina(dt);
  if (kind) return stepKind(dt);
  if (q.has('acts')) return stepActs(dt);
  t += dt;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#eef5e6';
  ctx.fillRect(0, 0, c.width, c.height);
  runners.forEach((m, i) => {
    m.dist += m.speed * dt;
    const x = 133 + (i % 3) * 267;
    const y = 190 + Math.floor(i / 3) * 175;
    // The treadmill: ground ticks sliding back as far as it runs.
    ctx.setTransform(Z, 0, 0, Z, 0, 0);
    ctx.fillStyle = '#bfe3a8';
    ctx.fillRect((x - 120) / Z, y / Z, 240 / Z, 4);
    ctx.fillStyle = '#9fd08a';
    for (let k = -2; k < 5; k++) ctx.fillRect((x - 120) / Z + ((((-m.dist) % 12) + 12) % 12) + k * 12, y / Z, 2, 4);
    drawMochiAnim(ctx, m, x / Z, y / Z, t);
    label(`${GAITS[i].name} · Run ${m.runPoints}`, x, y + 34);
  });
  idlers.forEach((m, i) => {
    const x = 100 + i * 200;
    const y = 555;
    ctx.setTransform(Z, 0, 0, Z, 0, 0);
    drawMochiAnim(ctx, m, x / Z, y / Z, t);
    label(m.genes.personality, x, y + 30);
  });
}
window.step = step;
window.frame = () => c.toDataURL('image/png');
window.ready = true;
if (!q.has('manual')) {
  let last = performance.now();
  const loop = (now) => { step(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else step(0);
</script></body></html>
