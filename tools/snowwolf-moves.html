<!doctype html>
<html><body style="margin:0;background:#6d8a6a">
<canvas id="c" width="1600" height="620"></canvas>
<script type="module">
// Dev tool: Snow wolf (the Beastmaster's companion, render/snowwolf.js) doing each of her moves on
// a loop, side by side, drawn the way the game draws her. Add ?manual to step frames from outside
// (window.step) for recording.
import { drawSnowWolf } from '../src/render/snowwolf.js';

const ctx = document.getElementById('c').getContext('2d');
const ZOOM = 2.4;
const MOVES = [
  ['standing', null, 2], ['walking', null, 2], ['swing', 'swing', 1.5], ['slam', 'slam', 1.6],
  ['flick', 'flick', 0.9], ['Moonfall', 'cast', 1.3], ['Lunar Howl', 'howl', 1.2], ['Moon Ward', 'ward', 1.1],
];
const pets = MOVES.map(([, kind], i) => ({ x: 0, y: 0, dir: 1, act: null, moving: i === 1, vx: i === 1 ? 78 : 0, body: { onGround: true, rope: null, vy: 0, y: 0 } }));
let t = 0;
function step(dt) {
  t += dt;
  ctx.fillStyle = '#6d8a6a';
  ctx.fillRect(0, 0, 1600, 620);
  MOVES.forEach(([name, kind, loop], i) => {
    const col = i % 4;
    const row = Math.floor(i / 4);
    const s = pets[i];
    const world = { now: t, char: { job: 'beastmaster', skills: {} }, bond: 0 };
    if (kind) s.act = { kind, t0: t - (t % loop), dur: loop };
    // Walking, she crosses her cell and comes round again (in place she'd look like she was moonwalking).
    if (s.moving) s.x = ((t * s.vx) % 160) - 80;
    ctx.save();
    ctx.translate(200 + col * 400, 240 + row * 300);
    ctx.scale(ZOOM, ZOOM);
    ctx.fillStyle = '#4e6b4c';
    ctx.fillRect(-80, 0, 160, 30);
    drawSnowWolf(ctx, world, s, { x: 0, y: 0 }, t);
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText(name, 120 + col * 400, 290 + row * 300);
  });
}
window.step = step;
if (!location.search.includes('manual')) {
  let last = performance.now();
  const loop = (now) => { step(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else step(0);
</script></body></html>
