<!doctype html>
<html><body style="margin:0;background:#2a2440">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: the kitsune guardian (render/kitsune.js) in each of her own hair styles
// (hair.js GUARDIAN_HAIR) side by side, standing and mid-move, to pick one.
import { drawKitsune } from '../src/render/kitsune.js';
import { KMOVES } from '../src/world/kitsune.js';
import { setHd, nextFrame } from '../src/render/pixel.js';
import { GUARDIAN_HAIR } from '../src/render/hair.js';

const OUTFITS = GUARDIAN_HAIR.map((h) => [h, h]);
const ROWS = [['stand', 0], ['sweep', 0.56]];
const S = 3.6;
const CW = 270;
const CH = 420;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = CW * OUTFITS.length;
canvas.height = CH * ROWS.length + 20;
const scratch = document.createElement('canvas').getContext('2d');
nextFrame();
const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
g.addColorStop(0, '#9fd8c0');
g.addColorStop(1, '#d8f0e0');
ctx.fillStyle = g;
ctx.fillRect(0, 0, canvas.width, canvas.height);
ROWS.forEach(([move, u], r) => OUTFITS.forEach(([outfit, name], i) => {
  const k = { body: {}, x: 0, y: 0, dir: 1, act: null, moving: false, vx: 0, look: { hairStyle: outfit } };
  const dur = KMOVES[move]?.dur;
  const world = { now: dur ? u * dur : 0 };
  if (dur) k.act = { kind: move, t0: 0, dur };
  const cx = i * CW + CW / 2 + 10;
  const gy = r * CH + CH - 60;
  ctx.save();
  ctx.translate(cx, gy);
  ctx.scale(S, S);
  ctx.fillStyle = '#6aa874';
  ctx.fillRect(-CW / S / 2, 0, CW / S, 2);
  setHd(true, S);
  for (let f = 0; f < 60; f++) drawKitsune(scratch, world, k, { x: 0, y: 0 }, f / 30);
  drawKitsune(ctx, world, k, { x: 0, y: 0 }, 2);
  ctx.restore();
  if (r === ROWS.length - 1) {
    ctx.fillStyle = '#2a2440';
    ctx.font = 'bold 17px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(name, cx - 10, gy + 30);
  }
}));
window.done = true;
</script></body></html>
