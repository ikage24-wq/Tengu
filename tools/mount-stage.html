<!doctype html>
<html><body style="margin:0;background:#dff3ff">
<canvas id="c" width="1440" height="900"></canvas>
<script type="module">
// Dev tool: every mount (render/mounts.js) with its rider, in three rows: standing (idle life),
// running, and its own trick (the bun's big jump, the crane's glide, the cloud's hover over a gap,
// the kettle's steam dash, the turtle skimming water, the gecko's scurry and leap).
// ?manual and window.step(t) for recording.
import { drawMount } from '../src/render/mounts.js';
import { randomLook } from '../src/ui/looks.js';

const ctx = document.getElementById('c').getContext('2d');
const Z = 3;
const IDS = ['bun', 'crane', 'nimbus', 'kettle', 'turtle', 'gecko'];
const NAMES = ['Puff Bun', 'Paper Crane', 'Nimbus', 'Kettle Racer', 'Shell Skipper', 'Ivy Gecko'];
const looks = [0.37, 0.12, 0.81, 0.55, 0.66, 0.29].map((s) => randomLook(((n) => () => (n = (n * 9301 + 49297) % 233280) / 233280)(Math.floor(s * 9999))));
const riders = IDS.map(() => [{}, {}, {}]);
const ROW_Y = [95, 195, 290];
const COL = (i) => 40 + i * 78;

function trick(id, t) {
  const c = t % 2.4;
  const arc = (dur, h) => { const k = Math.min(1, c / dur); return { y: -4 * h * k * (1 - k), vy: c < dur / 2 ? -1 : 1, air: c < dur }; };
  if (id === 'bun') { const a = arc(1.1, 34); return { ...a, motion: { speed: 0.6, air: a.air, vy: a.vy, landAt: t - (c - 1.1) } }; }
  if (id === 'crane') { const k = c / 2.4; return { y: -36 + k * 30, motion: { speed: 0.7, air: true, vy: 1, special: k > 0.15 ? 'glide' : null } }; }
  if (id === 'nimbus') { const k = c / 2.4; return { y: k < 0.7 ? 0 : (k - 0.7) * 40, motion: { speed: 0.6, air: k > 0.7, vy: 1, special: k < 0.7 ? 'hover' : null, hoverLeft: 1 - Math.min(1, k / 0.7) } }; }
  if (id === 'kettle') return { y: 0, motion: { speed: 1.3, special: c < 0.9 ? 'dash' : null } };
  if (id === 'turtle') return { y: 0, water: true, motion: { speed: 0.8, special: 'swim' } };
  const a = arc(0.7, 18);
  return { ...a, motion: { speed: 1, air: a.air, vy: a.vy, landAt: t - (c - 0.7) } };
}

function step(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, 900);
  g.addColorStop(0, '#bfe4ff'); g.addColorStop(1, '#f4fbff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1440, 900);
  ctx.setTransform(Z, 0, 0, Z, 0, 0);
  for (const [r, gy] of ROW_Y.entries()) {
    ctx.fillStyle = '#b8e0a8'; ctx.fillRect(0, gy, 480, 6);
    ctx.fillStyle = '#9fd090'; ctx.fillRect(0, gy, 480, 1);
    // running rows: the ground's tufts scroll past
    if (r > 0) for (let i = 0; i < 40; i++) { const x = ((i * 23 - t * 90) % 480 + 480) % 480; ctx.fillStyle = '#8cc983'; ctx.fillRect(x, gy + 2, 2, 1); }
  }
  ctx.font = 'bold 6px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#5a4a78';
  IDS.forEach((id, i) => {
    const x = COL(i);
    ctx.fillStyle = '#5a4a78'; ctx.fillText(NAMES[i], x, 14);
    drawMount(ctx, riders[i][0], id, x, ROW_Y[0], t, { facing: 1 }, { look: looks[i] });
    drawMount(ctx, riders[i][1], id, x, ROW_Y[1], t, { facing: 1, speed: 1 }, { look: looks[i] });
    const tr = trick(id, t);
    if (tr.water) { ctx.fillStyle = 'rgba(79,192,200,0.75)'; ctx.fillRect(x - 36, ROW_Y[2] - 4, 72, 10); }
    if (id === 'nimbus') { ctx.fillStyle = '#dff3ff'; ctx.fillRect(x - 20, ROW_Y[2], 46, 6); }
    drawMount(ctx, riders[i][2], id, x, ROW_Y[2] + tr.y, t, { facing: 1, ...tr.motion }, { look: looks[i] });
  });
  ctx.fillStyle = '#8a7aa8'; ctx.textAlign = 'left';
  ['standing', 'running', 'its trick'].forEach((s, r) => ctx.fillText(s, 2, ROW_Y[r] - 52));
}
window.step = step;
if (!location.search.includes('manual')) {
  const t0 = performance.now();
  const loop = (now) => { step((now - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else step(0.7);
</script></body></html>
