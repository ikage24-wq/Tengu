<!doctype html>
<html><body style="margin:0;background:#222">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: a real game world (the same code the game runs) with a level 60 Stormcaller, her
// skills maxed, and a row of training dummies, holding attack, drawn with the game's own scene
// renderer. Open /tools/stormcaller.html (served with the game). ?full keeps her Supercharged
// (Eye of the Storm's cloud); ?finisher casts Thunderhead; ?overcharge casts Overcharge first;
// ?manual steps frames from outside (window.step) for recording.
import { createWorld, updateWorld, loadMap } from '../src/world/world.js';
import { createCharacter, gainExp, advanceJob } from '../src/core/character.js';
import { makeEquip } from '../src/core/items.js';
import { spawnMob } from '../src/world/mobs.js';
import { cast } from '../src/world/combat.js';
import { createCamera, updateCamera, drawWorld } from '../src/render/scene.js';
import { setHd, nextFrame } from '../src/render/pixel.js';
import { preloadFxSprites } from '../src/render/fx-sprites.js';
import { VW, VH } from '../src/input.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const SCALE = 2;
canvas.width = VW * SCALE;
canvas.height = VH * SCALE;
preloadFxSprites();

const c = createCharacter('Tester', {});
gainExp(c, 1e6);
advanceJob(c, 'archer');
c.quests.archer_trial = { state: 'done', kills: {} };
advanceJob(c, 'stormcaller');
c.equipment.weapon = makeEquip('crossbow_20', {});
Object.assign(c.skills, { stormmastery: 20, arcbolt: 20, staticfield: 20, thunderclap: 20, lightningrod: 10, eyeofstorm: 10, overcharge: 10, thunderhead: 10 });
c.mp = 9999;
c.baseMp = 99999;
const w = createWorld(c);
loadMap(w, 'woods', 'west');
w.god = true;
w.spawner.slots = [];
w.mobs = [];
const x0 = 360;
Object.assign(w.body, { x: x0, y: w.map.groundY, facing: 1, onGround: true });
for (const dx of [110, 170, 230, 300, 360]) {
  const m = spawnMob(w.map, { mob: 'boarlet', x: x0 + dx, y: w.map.groundY });
  m.def = { ...m.def, hp: 1e9, eva: 0, aggro: false, speed: 0 };
  m.hp = 1e9;
  w.mobs.push(m);
}
const idle = { held: new Set(), pressed: new Set(), locked: false };
const hold = { held: new Set(['KeyZ']), pressed: new Set(), locked: false };
const cam = createCamera();
let t = 0;
for (let i = 0; i < 30; i++) updateWorld(w, 1 / 60, idle);
if (q.has('overcharge')) {
  cast(w, 'overcharge');
  for (let i = 0; i < 70; i++) updateWorld(w, 1 / 60, idle);
}
let cast0 = false;
function step(dt) {
  t += dt;
  if (q.has('full')) {
    w.charge = 100;
    w.chargeAt = w.now;
  }
  if (q.has('finisher') && !cast0 && t > 0.4) {
    cast0 = true;
    w.charge = 100;
    console.log('cast', JSON.stringify(cast(w, 'thunderhead')));
  }
  // Holding attack, except while the finisher plays out.
  const fighting = t > 0.5 && !q.has('finisher');
  for (let k = 0; k < Math.round(dt * 60); k++) updateWorld(w, 1 / 60, fighting ? hold : idle);
  nextFrame();
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;
  setHd(true, SCALE);
  updateCamera(cam, w, dt);
  drawWorld(ctx, w, cam, t);
}
window.step = step;
window.world = w;
if (!q.has('manual')) {
  let last = performance.now();
  const loop = (now) => { step(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script></body></html>
