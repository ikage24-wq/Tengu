<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;background:#f6efe8">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: the race festival's cast (render/courseart.js) on a pose sheet: the starter's routines
// (shouldering the flag, raising it for the countdown, swinging it down at Go, swaying after) and
// the cheer squad's (the pom-pom routine, a banner holder), each sampled across its length.
// ?rows=rest,up,go,sway,poms,banner&n=8&s=3. Title "ready" when drawn; window.SHOT the PNG.
// (The world first, as the game loads it: the race's modules lean on each other.)
import '../src/world/world.js';
import { drawCastFrame } from '../src/render/courseart.js';
import { setHd, nextFrame } from '../src/render/pixel.js';

const q = new URLSearchParams(location.search);
// ?play=8: instead, the cast animated in real time for that many seconds (the squad's routines and
// the starter waving), recorded to window.CLIP (a video blob) for checking smoothness.
if (q.get('play')) {
  const S2 = Number(q.get('s') ?? 4);
  const cv = document.getElementById('c');
  cv.width = 300 * S2;
  cv.height = 110 * S2;
  const g = cv.getContext('2d');
  setHd(true, S2);
  const rec = new MediaRecorder(cv.captureStream(30), { mimeType: 'video/mp4;codecs=avc1', videoBitsPerSecond: 2.5e6 });
  const chunks = [];
  rec.ondataavailable = (e) => chunks.push(e.data);
  const t0 = performance.now();
  let started = false;
  await new Promise((done) => {
    const frame = () => {
      const t = (performance.now() - t0) / 1000;
      nextFrame();
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = '#f6efe8';
      g.fillRect(0, 0, cv.width, cv.height);
      g.setTransform(S2, 0, 0, S2, 0, 0);
      g.fillStyle = '#e8dcd2';
      g.fillRect(0, 96, 300, 1);
      drawCastFrame(g, 'banner', 40, 96, (t * 0.9) % 2.4, t, 1);
      drawCastFrame(g, 'poms', 100, 96, t % 3.6, t, 1);
      drawCastFrame(g, 'banner', 160, 96, (t * 0.9 + 0.55) % 2.4, t, -1);
      drawCastFrame(g, 'sway', 240, 96, t % 3.2, t, 1);
      // (A second of warm-up so every drawing's painted, then the clip.)
      if (!started && t > 1.5) {
        started = true;
        rec.start();
      }
      if (t < Number(q.get('play')) + 1.5) requestAnimationFrame(frame);
      else done();
    };
    requestAnimationFrame(frame);
  });
  rec.stop();
  await new Promise((r) => (rec.onstop = r));
  window.CLIP = new Blob(chunks, { type: 'video/mp4' });
  document.title = 'ready';
  throw new Error('played');
}
const rows = (q.get('rows') ?? 'rest,up,go,sway,poms,banner').split(',');
const LEN = { rest: 4.2, up: 1.4, go: 2.8, sway: 3.2, poms: 1.8, banner: 0.8, pound: 1.4, turn: 1.4, hurray: 0.5 };
const n = Number(q.get('n') ?? 8);
const S = Number(q.get('s') ?? 3);
const CW = 64;
const CH = 70;
const canvas = document.getElementById('c');
canvas.width = (CW * n + 60) * S;
canvas.height = CH * rows.length * S;
const ctx = canvas.getContext('2d');
setHd(true, S);
// (The Mochi drawings paint on demand: draw a few times so every pose is in.)
for (let pass = 0; pass < 4; pass++) {
  nextFrame();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#f6efe8';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(S, 0, 0, S, 0, 0);
  rows.forEach((row, r) => {
    ctx.fillStyle = '#a8467a';
    ctx.font = '700 7px sans-serif';
    ctx.fillText(row, 4, r * CH + 12);
    ctx.fillStyle = '#e8dcd2';
    ctx.fillRect(60, r * CH + CH - 8, CW * n, 1);
    for (let i = 0; i < n; i++) {
      const t = (i / n) * LEN[row];
      drawCastFrame(ctx, row, 60 + i * CW + CW / 2, r * CH + CH - 8, t, 10 + t, 1, q.get('cast') ?? 'sakura');
    }
  });
  await new Promise((res) => setTimeout(res, 400));
}
window.SHOT = canvas.toDataURL('image/png');
document.title = 'ready';
</script>
</body></html>
