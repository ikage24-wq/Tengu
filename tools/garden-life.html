<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;background:#222">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: your Mochi Garden with Mochi living in it (world/garden-life.js), drawn as the game
// draws it. ?n=8 Mochi (a mix: babies who can't walk or swim yet, grown ones, swimmers), ?x=900 where
// you stand, ?night=1, ?eggs=2. ?manual steps only through window.step(dt) (for recording), on
// its own clock (Date.now follows the steps, so the garden's clock moves smoothly frame to frame);
// window.frame() gives the canvas. Raising: ?ui=1 draws the windows; ?care=0 opens Mochi 0's care
// panel (you beside it); ?kitchen=1 at the Sweet Kitchen with crops in your bag; ?sweets=1 a few
// sweets in your bag; ?skip=30 runs 30 s on first; ?follow=1&who=0 keeps the camera on Mochi 0.
// ?guest=1: you're visiting Ann's garden (these Mochi are hers); ?reborn=1: Mochi 1 has lived a
// long, happy life (it goes back to its egg); ?icons=1 draws the garden's item icons up top.
// Racing: ?map=mochi_stadium&x=330&board=1 the Race Stadium with its board open; ?race=sprint&who=1
// races Mochi 1 there (?cheer=1: Up every 2 s; ?raceskip=25 starts 25 s in).
import { balanceChar } from './balance.mjs';
import { createWorld, updateWorld, loadMap } from '../src/world/world.js';
import { createCamera, updateCamera, drawWorld } from '../src/render/scene.js';
import { setHd, nextFrame } from '../src/render/pixel.js';
import { preloadFxSprites } from '../src/render/fx-sprites.js';
import { VW, VH } from '../src/input.js';
import { rollMochi, STATS } from '../src/data/mochi-genes.js';
import { newRecord, giveExp, evolve, MOCHI_SWEETS, GARDEN_CROPS } from '../src/data/mochi-raise.js';
import { drawItemIcon } from '../src/render/icons.js';
import { startRace } from '../src/world/mochi-race.js';
import { createInput } from '../src/input.js';
import { beginUi, endUi } from '../src/ui/kit.js';
import { createUiState, drawUi } from '../src/ui/manager.js';
import { addItem } from '../src/core/inventory.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const SCALE = Number(q.get('s') ?? 1);
canvas.width = VW * SCALE;
canvas.height = VH * SCALE;
preloadFxSprites();
const c = balanceChar('thief', 30);
// (Manual stepping keeps its own clock.)
const realNow = Date.now.bind(Date);
const base = realNow();
let simT = 0;
if (q.has('manual')) Date.now = () => base + simT * 1000;
// A garden with Mochi of every kind.
const n = Number(q.get('n') ?? 8);
const mochi = [];
for (let i = 0; i < n; i++) {
  const rec = newRecord(rollMochi(900 + i * 17, { coat: null }));
  rec.bond = 300 + i * 40;
  if (i % 4 !== 0) for (const s of STATS) giveExp(rec, s, i % 3 === 0 ? 300 : 1400);
  if (i % 2 === 1) {
    rec.age = 99999;
    rec.mood = 90;
    evolve(rec);
    // (Grown, but not yet at the end of its life.)
    rec.age = 4 * 3600;
  }
  if (i % 3 === 1) giveExp(rec, 'swim', 3000);
  mochi.push(rec);
}
if (q.has('reborn')) Object.assign(mochi[1], { age: 30 * 3600, mood: 95 });
c.garden = { back: null, mochi, eggs: Array.from({ length: Number(q.get('eggs') ?? 2) }, (_, i) => ({ seed: 4242 + i })), unlocked: {} };
const w = createWorld(c);
w.log = (m) => console.log(m);
window.W = w;
if (q.get('night') != null) w.forceNight = Number(q.get('night'));
if (q.has('guest')) w.gardenVisit = { ownerId: 'A', name: 'Ann', garden: c.garden };
loadMap(w, q.get('map') ?? 'garden', 'start');
w.god = true;
Object.assign(w.body, { x: Number(q.get('x') ?? 300), vx: 0, vy: 0, facing: 1 });
const idle = { held: new Set(), pressed: new Set(), locked: false };
const cam = createCamera();
let t = 0;
let steps = 0;
const input = createInput(canvas);
const state = createUiState();
function step(dt, draw = true) {
  simT += dt;
  w.scene = null;
  // (?rock=1: you press Up by the first egg a moment in, to hatch it.)
  if (q.has('rock') && ++steps === 30) idle.pressed.add('ArrowUp');
  if (q.has('cheer') && ++steps % 40 === 0) idle.pressed.add('ArrowUp');
  updateWorld(w, dt, idle);
  idle.pressed.delete('ArrowUp');
  t += dt;
  updateCamera(cam, w, dt);
  // (?follow=1: the camera follows Mochi `who` instead of you.)
  const fe = q.has('follow') && w.gardenLife?.mochi[Number(q.get('who') ?? 0)];
  if (fe && fe.x != null) {
    const k = cam.fx == null ? 1 : Math.min(1, dt * 4);
    cam.fx = (cam.fx ?? fe.x) + (fe.x - (cam.fx ?? fe.x)) * k;
    cam.fy = (cam.fy ?? fe.y) + (fe.y - (cam.fy ?? fe.y)) * k;
    cam.x = cam.fx - VW / 2;
    cam.y = cam.fy - VH * 0.62;
  }
  if (!draw) return;
  nextFrame();
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.imageSmoothingEnabled = false;
  setHd(true, SCALE);
  drawWorld(ctx, w, cam, t);
  if (q.has('icons')) ['mochi_bell', ...Object.keys(GARDEN_CROPS), ...MOCHI_SWEETS.slice(0, 5).map((sw) => sw.id)].forEach((id, k) => drawItemIcon(ctx, id, 8 + k * 36, 8, 2));
  if (q.has('ui')) {
    const ui = beginUi(ctx, input);
    drawUi(ui, state, w);
    endUi(ui);
  }
}
window.step = step;
window.frame = () => canvas.toDataURL('image/png');
window.press = (key) => { idle.pressed.add(key); step(1 / 60); idle.pressed.delete(key); };
for (let k = 0; k < 120; k++) updateWorld(w, 1 / 60, idle);
if (q.has('sweets')) for (const sw of MOCHI_SWEETS.slice(0, 6)) addItem(c.inventory, sw.id, 3);
const life = w.gardenLife;
for (let k = 0; k < Number(q.get('skip') ?? 0) * 30; k++) step(1 / 30, false);
if (q.has('care')) {
  const e = life.mochi[Number(q.get('care'))];
  Object.assign(w.body, { x: e.x - 14, facing: 1 });
  life.caring = e;
  Object.assign(state.windows.mochi, { open: true, openedAt: -99 });
}
if (q.has('kitchen')) {
  for (const [id, n] of Object.entries({ mochi_rice: 6, azuki: 4, kinako: 2, fire_pepper: 1, cherry: 2, honeycomb: 2 })) addItem(c.inventory, id, n);
  Object.assign(w.body, { x: w.map.stove, facing: 1 });
  Object.assign(state.windows.cook, { open: true, openedAt: -99 });
}
if (q.has('board')) Object.assign(state.windows.race, { open: true, openedAt: -99 });
if (q.has('race')) startRace(w, c.garden.mochi[Number(q.get('who') ?? 0)], q.get('race'));
// (?raceskip=25: that far into the race first.)
for (let k = 0; k < Number(q.get('raceskip') ?? 0) * 30; k++) step(1 / 30, false);
for (let k = 0; k < 60; k++) step(1 / 60, false);
window.ready = true;
if (!q.has('manual')) {
  let last = performance.now();
  const loop = (now) => { step(Math.min(0.05, (now - last) / 1000)); last = now; requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script></body></html>
