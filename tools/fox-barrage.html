<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;background:#222">
<canvas id="c"></canvas>
<script type="module">
// Dev tool: Endless Fox-Fire up close. A level 60 Kitsune with the passive among training dummies,
// drawn with the game's own renderer, zoomed in on her.
//   (default)       live: she holds attack; ?zoom=3
//   ?manual         stepped from outside: window.go(secs) holds attack that long (0 lets go) and
//                   draws; window.strip(n, dt) draws the next n frames, dt apart, side by side
//   ?sheet&heat=0.5 every barrage pose drawn at 7 moments of its motion, a row each (&moves=a,b
//                   for just those, &cols=n for more moments)
import { balanceChar } from './balance.mjs';
import { createWorld, updateWorld, loadMap } from '../src/world/world.js';
import { spawnMob } from '../src/world/mobs.js';
import { MOBS } from '../src/data/mobs.js';
import { createCamera, updateCamera, drawWorld } from '../src/render/scene.js';
import { drawHero } from '../src/render/hero.js';
import { setHd, nextFrame } from '../src/render/pixel.js';
import { preloadFxSprites } from '../src/render/fx-sprites.js';
import { wornGear } from '../src/core/character.js';
import { STREAM_MOVES } from '../src/world/melee.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
preloadFxSprites();

const c = balanceChar('kitsune', 60);
c.mp = c.baseMp = 99999;
c.skills.foxbarrage = 10;
c.inventory.use.unshift({ id: 'star_pebble', qty: 1 });
const w = createWorld(c);
w.log = () => {};
loadMap(w, 'woods', 'west');
w.spawner.slots = [];
w.mobs = [];
w.god = true;
Object.assign(w.body, { x: 300, y: w.map.groundY, facing: 1 });
const base = Object.values(MOBS).filter((m) => !m.boss && m.level <= 50).sort((a, b) => b.level - a.level)[0];
for (const x of [400, 440, 480]) {
  const m = spawnMob(w.map, { mob: base.id, x, y: w.map.groundY });
  m.def = { ...m.def, hp: 1e9, aggro: false, speed: 0, atk: 0 };
  m.hp = 1e9;
  w.mobs.push(m);
}
const cam = createCamera();
const idle = { held: new Set(), pressed: new Set(), locked: false };
for (let k = 0; k < 240; k++) updateWorld(w, 1 / 60, idle);
let t = 0;
let holding = false;

const tick = (n, hold) => {
  for (let k = 0; k < n; k++) {
    for (const m of w.mobs) m.hp = 1e9;
    updateWorld(w, 1 / 60, hold ? { held: new Set(['KeyZ']), pressed: new Set(holding ? [] : ['KeyZ']), locked: false } : idle);
    holding = hold;
    t += 1 / 60;
  }
};

// Draws the world zoomed `z` times on the hero, into the box (bx, by, bw, bh).
function view(bx, by, bw, bh, z) {
  nextFrame();
  updateCamera(cam, w, 1 / 60);
  ctx.save();
  ctx.beginPath();
  ctx.rect(bx, by, bw, bh);
  ctx.clip();
  const hx = w.body.x - cam.x;
  const hy = w.body.y - 18 - cam.y;
  ctx.setTransform(z, 0, 0, z, bx + bw / 2 - hx * z, by + bh / 2 - hy * z);
  ctx.imageSmoothingEnabled = false;
  setHd(true, z);
  drawWorld(ctx, w, cam, t);
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

const label = (s, x, y) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(s, x, y);
};

const Z = Number(q.get('zoom') ?? 3);
if (q.has('sheet')) {
  const heat = Number(q.get('heat') ?? 0.5);
  const moves = q.get('moves')?.split(',') ?? [...STREAM_MOVES];
  const cols = Number(q.get('cols') ?? 7);
  // (&z=5 draws them bigger.)
  const sz = Number(q.get('z') ?? 3);
  const cw = 50 * sz;
  const rh = 42 * sz;
  canvas.width = 130 + cols * cw;
  canvas.height = moves.length * rh;
  ctx.fillStyle = '#3a3346';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const gear = wornGear(c);
  moves.forEach((kind, r) => {
    label(kind, 6, r * rh + 64);
    for (let i = 0; i < cols; i++) {
      const p = i / (cols - 1);
      nextFrame();
      ctx.setTransform(sz, 0, 0, sz, 0, 0);
      setHd(true, sz);
      const x = (130 + i * cw + cw / 2) / sz;
      const y = (r * rh + rh - 14) / sz;
      ctx.fillStyle = '#4a4258';
      ctx.fillRect(x - 15, y, 30, 1);
      drawHero(ctx, c.appearance, gear, x, y, { pose: kind, progress: p, dur: 0.1, time: 1 + i * 0.1, facing: 1, alpha: 1, job: 'kitsune', hit: 0.4, flow: { t0: 1 + r * 0.37 + p * 0.1, heat } });
    }
  });
} else {
  canvas.width = q.has('manual') ? 1000 : 960;
  canvas.height = q.has('manual') ? 620 : 540;
  window.go = (secs) => {
    tick(Math.round(secs * 60), secs > 0);
    if (secs === 0) tick(1, false);
    view(0, 0, canvas.width, canvas.height, Z);
    label(`held ${(w.barrage ? w.now - w.barrage.since : 0).toFixed(2)}s  heat ${(w.pose?.flow?.heat ?? 0).toFixed(2)}  ${w.pose?.kind ?? ''}`, 10, 22);
  };
  window.strip = (n = 6, dt = 1 / 30, cols = 3) => {
    const bw = canvas.width / cols;
    const bh = canvas.height / Math.ceil(n / cols);
    for (let i = 0; i < n; i++) {
      tick(Math.max(1, Math.round(dt * 60)), true);
      view((i % cols) * bw, Math.floor(i / cols) * bh, bw - 2, bh - 2, Z);
      label(`${(w.now - (w.barrage?.since ?? w.now)).toFixed(2)}s ${w.pose?.kind ?? ''}`, (i % cols) * bw + 8, Math.floor(i / cols) * bh + 18);
    }
  };
  window.world = w;
  window.ready = true;
  if (!q.has('manual')) {
    let last = performance.now();
    const loop = (now) => {
      tick(Math.max(1, Math.round(Math.min(0.05, (now - last) / 1000) * 60)), true);
      last = now;
      view(0, 0, canvas.width, canvas.height, Z);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}
</script></body></html>
